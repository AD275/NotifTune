plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.notiftune'
    compileSdk 36

    defaultConfig {
        applicationId 'com.notiftune'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('../notiftune.keystore')
            storePassword 'notiftune'
            keyAlias 'notiftune'
            keyPassword 'notiftune'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Xposed  legacy API（minversion 82，避免 New XSharedPreferences 废弃警告）
    compileOnly 'de.robv.android.xposed:api:82'
}
