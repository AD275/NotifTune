plugins { id 'com.android.application' }

android {
    namespace 'dev.codex.classicshade'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.codex.classicshade'
        minSdk 31
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
